name: Data sync (Excel vers JSON)

# Sens INVERSE automatique : quand on pousse un data/solutions_master.xlsx modifie, on reinjecte les
# changements dans les JSON sources, on regenere les sorties, on recommit, puis on declenche le
# deploiement du site et la reindexation Typesense.
#
# Anti-boucle : le commit de regeneration est fait avec le GITHUB_TOKEN (les pushes par ce token ne
# redeclenchent PAS les workflows), donc ce workflow ne se rappelle pas lui-meme. On declenche
# explicitement Deploy + Reindex avec `gh workflow run`.

on:
  push:
    branches: [main]
    paths:
      - "data/solutions_master.xlsx"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    # On ne traite pas nos propres commits de regeneration.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install openpyxl

      - name: Excel -> JSON puis regeneration
        run: |
          python3 scripts/xlsx_to_json.py
          python3 scripts/build_app_data.py
          python3 scripts/build_master_xlsx.py

      - name: Recommit des fichiers regeneres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/solutions.json data/size_review.json \
                  data/solutions.generated.js data/solutions_master.xlsx
          if git diff --cached --quiet; then
            echo "Aucun changement a committer."
          else
            git commit -m "Data sync depuis Excel [auto]"
            git push
          fi

      - name: Declencher deploiement + reindexation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy GitHub Pages" --ref main || true
          gh workflow run "Reindex Typesense" --ref main || true
