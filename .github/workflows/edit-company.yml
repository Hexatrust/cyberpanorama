name: ✏️ Modifier une entreprise existante

on:
  issues:
    types: [labeled]

jobs:
  edit-company:
    # S'exécute uniquement quand le label "approved" est ajouté sur une issue qui a déjà le label "radar:edit-entry"
    if: |
      github.event.label.name == 'approved' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'radar:edit-entry') &&
      !contains(github.event.issue.labels.*.name, 'completed') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: radar-automation

    permissions:
      contents: write
      issues: write

    steps:
      - name: 🔥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            pkg-config

      - name: 📦 Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: 🔄 Synchronize with latest changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin ${{ github.event.repository.default_branch }}

      - name: ✏️ Parse issue and update company
        id: edit_company
        run: |
          python3 .github/scripts/edit_company.py ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: 🚀 Regenerate radar
        run: |
          python3 src/main.py

      - name: 📊 Commit and push changes with retry
        id: commit_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Ajouter tous les fichiers modifiés dans assets/
          git add assets/solutions.xlsx
          git add assets/logos/ 2>/dev/null || true
          git add assets/*.svg assets/*.png 2>/dev/null || true
          git add assets/*.csv 2>/dev/null || true

          # Vérifier s'il y a des changements à committer
          if git diff --staged --quiet; then
            echo "Aucun changement à committer"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          COMPANY_NAME="${{ steps.edit_company.outputs.company_name }}"
          MODIFICATIONS="${{ steps.edit_company.outputs.modifications }}"
          
          # Stratégie de retry avec pull-rebase-push
          max_retries=10
          retry_count=0
          base_delay=5
          
          while [ $retry_count -lt $max_retries ]; do
            # Créer le commit
            git commit -m "feat: Update company $COMPANY_NAME [skip ci]

            - Updated from issue #${{ github.event.issue.number }}
            - Modifications: $MODIFICATIONS
            - Radar regenerated automatically" 2>/dev/null || git commit --amend --no-edit
            
            # Essayer de pull + push
            if git pull --rebase origin ${{ github.event.repository.default_branch }}; then
              # Si le pull réussit, vérifier s'il y a des conflits
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "⚠️ Conflits détectés, résolution automatique..."
                # Résoudre les conflits en favorisant nos changements
                git checkout --ours assets/
                git add assets/
                git rebase --continue
              fi
              
              # Essayer de pousser
              if git push origin ${{ github.event.repository.default_branch }}; then
                echo "✅ Push réussi après $retry_count tentative(s)"
                exit 0
              fi
            fi
            
            # Si échec, reset et retry
            retry_count=$((retry_count + 1))
            delay=$((base_delay + RANDOM % 10))
            
            if [ $retry_count -lt $max_retries ]; then
              echo "❌ Tentative $retry_count/$max_retries échouée"
              echo "🔄 Réinitialisation et nouvelle tentative dans ${delay}s..."
              
              # Reset le commit pour le refaire
              git reset --soft HEAD~1
              
              # Pull les derniers changements
              git fetch origin ${{ github.event.repository.default_branch }}
              git reset --hard origin/${{ github.event.repository.default_branch }}
              
              # Re-générer le radar avec les dernières données
              python3 src/main.py
              
              # Re-ajouter les fichiers
              git add assets/solutions.xlsx
              git add assets/logos/ 2>/dev/null || true
              git add assets/*.svg assets/*.png 2>/dev/null || true
              git add assets/*.csv 2>/dev/null || true
              
              sleep $delay
            fi
          done
          
          echo "❌ Échec du push après $max_retries tentatives"
          exit 1

      - name: 💬 Comment on issue
        if: steps.commit_push.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const companyName = '${{ steps.edit_company.outputs.company_name }}';
            const modifications = '${{ steps.edit_company.outputs.modifications }}';
            const issueNumber = context.issue.number;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const commitSha = context.sha.substring(0, 7);

            const message = `# ✅ Mise à jour effectuée avec succès

            **Entreprise modifiée :** ${companyName}

            ---

            ## Modifications appliquées

            ${modifications.split(', ').map(mod => `- ${mod}`).join('\n')}

            ## Détails techniques

            - **Issue :** #${issueNumber}
            - **Commit :** [\`${commitSha}\`](https://github.com/${repoOwner}/${repoName}/commit/${context.sha})
            - **Date :** ${new Date().toLocaleString('fr-FR', { timeZone: 'Europe/Paris', dateStyle: 'full', timeStyle: 'short' })}

            ## Visualiser les changements

            Vous pouvez consulter le radar mis à jour :
            - **[Voir le radar SVG](https://github.com/${repoOwner}/${repoName}/blob/main/assets/Panorama_cyber.svg)** (haute qualité)
            - **[Télécharger le radar PNG](https://github.com/${repoOwner}/${repoName}/blob/main/assets/Panorama_cyber.png)** (image)

            ---

            **Merci pour votre contribution au radar Hexatrust !**

            *Cette notification a été générée automatiquement par GitHub Actions.*`;

            github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: repoOwner,
              repo: repoName,
              body: message
            });

      - name: 🏷️ Close and label issue
        uses: actions/github-script@v7
        with:
          script: |
            // Fermer l'issue
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });

            // Ajouter le label 'completed' sans toucher aux autres labels
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['completed']
            });