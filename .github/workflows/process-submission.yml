name: Appliquer une soumission approuvee

# Flux de contribution : un visiteur ouvre une issue via un formulaire (panorama:new-entry / panorama:edit).
# RIEN ne se fait automatiquement. Un mainteneur relit, et quand c'est bon il pose le label "approved".
# Ce label declenche ce workflow : on parse l'issue, on ecrit la donnee dans solutions.json, on regenere
# le site ET l'Excel, on commit sur main, puis on declenche le deploiement et la reindexation.
#
# Garde-fou : seuls les membres avec droit d'ecriture peuvent poser un label, donc l'approbation est
# reservee aux mainteneurs. Le job checkout le code de confiance (main), jamais le contenu de l'issue.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    # Uniquement quand on AJOUTE le label "approved" a une issue de soumission.
    if: >-
      github.event.label.name == 'approved' &&
      (contains(github.event.issue.labels.*.name, 'panorama:new-entry') ||
       contains(github.event.issue.labels.*.name, 'panorama:edit'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install openpyxl

      - name: Determiner le mode (ajout ou modification)
        id: mode
        run: |
          if [ "${{ contains(github.event.issue.labels.*.name, 'panorama:edit') }}" = "true" ]; then
            echo "value=edit" >> "$GITHUB_OUTPUT"
          else
            echo "value=add" >> "$GITHUB_OUTPUT"
          fi

      - name: Appliquer la soumission puis regenerer site + Excel
        id: parse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Valeurs passees par l'environnement (jamais interpolees dans la ligne de commande)
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -o pipefail
          python3 .github/scripts/parse_submission.py "$ISSUE_NUMBER" "$MODE" 2>&1 | tee /tmp/apply.log
          python3 scripts/build_app_data.py
          python3 scripts/build_master_xlsx.py

      - name: En cas d'echec, commenter l'issue et retirer approved
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERR=$(tail -n 25 /tmp/apply.log 2>/dev/null)
          [ -z "$ERR" ] && ERR="Le traitement a échoué (voir les logs de l'action)."
          {
            echo "## La soumission n'a pas pu être appliquée"
            echo
            echo "**Erreur :**"
            echo '```'
            echo "$ERR"
            echo '```'
            echo
            echo "**Comment corriger :**"
            echo "1. En haut du **premier message** de cette issue (la description), cliquez sur le menu **...** puis **Edit**, et corrigez les champs concernés par l'erreur ci-dessus (par exemple un code NIST inexistant, ou une catégorie N2 qui ne correspond pas à la fonction choisie)."
            echo "2. Une fois corrigé, un **mainteneur du dépôt** remettra le label approved pour relancer le traitement (seuls les mainteneurs peuvent poser ce label)."
            echo
            echo "Rappel : le N2 doit appartenir à la fonction N1 (par exemple fonction Protéger : codes PR.xx), et le N3 à une N2 choisie (par exemple PR.DS : PR.DS-01). Un code N3 valide mais rattaché à la mauvaise N2 est aussi refusé."
          } > /tmp/comment.md
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --remove-label approved || true

      - name: Commit sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/logos/
          if git diff --cached --quiet; then
            echo "Aucun changement a committer."
          else
            git commit -m "Soumission #${{ github.event.issue.number }} : ${{ steps.parse.outputs.company_name }} [approved]"
            git push
          fi

      - name: Declencher deploiement + reindexation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy GitHub Pages" --ref main || true
          gh workflow run "Reindex Typesense" --ref main || true

      - name: Commenter et fermer l'issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Soumission approuvée et appliquée. Le panorama va se redéployer automatiquement. Merci pour la contribution."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" || true
