name: 🏢 Ajouter une entreprise au Radar
description: Proposez l'ajout d'une solution de cybersécurité souveraine au radar Hexatrust
title: "[NOUVELLE ENTREPRISE] : "
labels: ["radar:new-entry"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🎯 Ajouter une nouvelle solution au Radar Hexatrust

        Merci de contribuer au radar ! Remplissez ce formulaire pour proposer l'ajout d'une solution de cybersécurité souveraine.

        **Note :** Les informations seront vérifiées avant l'ajout au radar.

  - type: input
    id: company_name
    attributes:
      label: 🏢 Nom de l'entreprise/solution
      description: Nom officiel de l'entreprise ou de la solution
      placeholder: "Ex: CyberCompany"
    validations:
      required: true

  - type: dropdown
    id: fonction_nist
    attributes:
      label: 🎯 Fonction NIST principale
      description: Sélectionnez la fonction NIST correspondant à votre solution
      options:
        - Identifier
        - Protéger
        - Détecter
        - Répondre
        - Récupérer
        - Gouverner
    validations:
      required: true

  - type: checkboxes
    id: sous_fonctions_nist
    attributes:
      label: 🔍 Sous-fonctions NIST CSF 2.0 (optionnel, max 3)
      description: Sélectionnez jusqu'à 3 sous-catégories spécifiques du NIST CSF 2.0
      options:
        - label: "GV.OC - Organizational Context"
        - label: "GV.RM - Risk Management Strategy"
        - label: "GV.SC - Cybersecurity Supply Chain Risk Management"
        - label: "GV.RR - Roles, Responsibilities, and Authorities"
        - label: "GV.PO - Policies, Processes, and Procedures"
        - label: "GV.OV - Oversight"
        - label: "ID.AM - Asset Management"
        - label: "ID.RA - Risk Assessment"
        - label: "ID.IM - Improvement"
        - label: "PR.AA - Identity Management, Authentication, and Access Control"
        - label: "PR.AT - Awareness and Training"
        - label: "PR.DS - Data Security"
        - label: "PR.PS - Platform Security"
        - label: "PR.IR - Technology Infrastructure Resilience"
        - label: "DE.CM - Continuous Monitoring"
        - label: "DE.AE - Adverse Event Analysis"
        - label: "RS.MA - Incident Management"
        - label: "RS.AN - Incident Analysis"
        - label: "RS.CO - Incident Response Reporting and Communication"
        - label: "RS.MI - Incident Mitigation"
        - label: "RC.RP - Incident Recovery Plan Execution"
        - label: "RC.CO - Incident Recovery Communication"

  - type: dropdown
    id: objectif_nis2
    attributes:
      label: 🛡️ Objectif NIS2 principal (optionnel)
      description: Sélectionnez l'objectif NIS2 principal couvert par votre solution
      options:
        - (Aucun)
        - Recensement des SI
        - Mise en oeuvre d'un cadre de gouvernance
        - Maitrise de l'écosystème
        - Prise en compte de la sécurité numérique dans la gestion des RH
        - Maitrise des SI
        - Maitrise des accès physiques aux locaux
        - Sécurisation de l'architecture des SI
        - Sécurisation des accès distants aux SI
        - Protection des SI contre les codes malveillants
        - Gestion des identités et des accès aux SI
        - Maitrise de l'administration des SI
        - Identification et réaction aux incidents de sécurité
        - Continuité et reprise d'activité
        - Réaction aux crises d'origine cyber
        - Exercices, tests, et entrainements
        - Mise en oeuvre d'une approche par les risques
        - Audit de la sécurité des SI
        - Sécurisation de la configuration des ressources des SI
        - Administration des SI depuis des ressources dédiées

  - type: dropdown
    id: taille
    attributes:
      label: 📏 Taille de l'entreprise
      description: Taille relative de l'entreprise pour l'affichage sur le radar
      options:
        - "0 - Very Large (grand groupe)"
        - "1 - Large (ETI, solution mature, scale up)"
        - "2 - Medium (PME)"
        - "3 - Small (petite entreprise, startup)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Description de la solution
      description: Décrivez brièvement la solution (objectifs, fonctionnalités principales)
      placeholder: |
        Ex: Solution de détection des menaces en temps réel basée sur l'IA,
        destinée aux entreprises de taille moyenne. Conforme RGPD et NIS2.
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: 🌐 Site web
      description: URL du site web officiel de l'entreprise
      placeholder: "https://exemple.fr"
    validations:
      required: false

  - type: input
    id: logo_url
    attributes:
      label: 🖼️ URL du logo
      description: |
        Lien direct vers le logo de l'entreprise (format PNG, SVG, JPG ou WebP)
        **Important :** Le logo doit être accessible publiquement
      placeholder: "https://exemple.fr/logo.png"
    validations:
      required: true

  - type: checkboxes
    id: criteres_souverainete
    attributes:
      label: ✅ Critères de souveraineté
      description: Cochez les critères de souveraineté que votre solution respecte
      options:
        - label: Données hébergées en France/Europe
        - label: Soumis au droit français (RGPD, NIS2)
        - label: Indépendance technologique
        - label: Transparence (code source accessible ou audits)

  - type: checkboxes
    id: agreement
    attributes:
      label: 📜 Engagement
      description: En soumettant ce formulaire, vous certifiez que
      options:
        - label: Les informations fournies sont exactes
          required: true
        - label: Vous avez les droits sur le logo fourni
          required: true
        - label: Vous acceptez la publication sur le radar
          required: true
