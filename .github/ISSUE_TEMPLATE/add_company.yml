name: Ajouter une entreprise au panorama
description: Proposer l'ajout d'une solution de cybersécurité française ou européenne au CyberPanorama
title: "[NOUVELLE ENTREPRISE] : "
labels: ["panorama:new-entry"]
body:
  - type: markdown
    attributes:
      value: |
        ## Ajouter une solution au CyberPanorama
        Cette soumission n'est pas publiée directement : un mainteneur la relit, et quand c'est bon il pose
        le label `approved` pour l'appliquer et la mettre en ligne.

  - type: input
    id: company_name
    attributes:
      label: Nom de l'entreprise ou de la solution
      description: Nom officiel
      placeholder: "Ex : CyberCompany"
    validations:
      required: true

  - type: dropdown
    id: fonction_nist
    attributes:
      label: Fonction NIST CSF 2.0 principale
      options: [Gouverner, Identifier, Protéger, Détecter, Répondre, Récupérer]
    validations:
      required: true

  - type: dropdown
    id: categories_nist
    attributes:
      label: Catégories NIST CSF 2.0 - N2 (1 à 3)
      description: Choisissez 1 à 3 catégories de niveau 2 (N2). Obligatoire.
      multiple: true
      options:
        - "GV.OC : Contexte organisationnel"
        - "GV.RM : Stratégie de gestion des risques"
        - "GV.SC : Gestion des risques de la chaîne d'approvisionnement"
        - "GV.RR : Rôles, responsabilités et autorités"
        - "GV.PO : Politiques"
        - "GV.OV : Supervision"
        - "ID.AM : Gestion des actifs"
        - "ID.RA : Évaluation des risques"
        - "ID.IM : Amélioration"
        - "PR.AA : Identité, authentification et contrôle d'accès"
        - "PR.AT : Sensibilisation et formation"
        - "PR.DS : Sécurité des données"
        - "PR.PS : Sécurité des plateformes"
        - "PR.IR : Résilience de l'infrastructure technologique"
        - "DE.CM : Surveillance continue"
        - "DE.AE : Analyse des événements indésirables"
        - "RS.MA : Gestion des incidents"
        - "RS.AN : Analyse des incidents"
        - "RS.CO : Communication sur la réponse"
        - "RS.MI : Atténuation des incidents"
        - "RC.RP : Exécution du plan de rétablissement"
        - "RC.CO : Communication sur le rétablissement"
    validations:
      required: true

  - type: dropdown
    id: sous_categories_nist
    attributes:
      label: Sous-catégories NIST CSF 2.0 - N3
      description: Choisissez les sous-catégories de niveau 3 (N3), rattachées aux catégories N2 choisies ci-dessus. Obligatoire.
      multiple: true
      options:
        - "GV.OC-01 : La mission de l'organisation est comprise et oriente la gestion des risques cyber"
        - "GV.OC-02 : Les besoins et attentes des parties prenantes internes et externes sont compris et pris en co..."
        - "GV.OC-03 : Les exigences légales, réglementaires et contractuelles sont comprises et gérées"
        - "GV.OC-04 : Les objectifs, capacités et services critiques dont dépendent les parties prenantes sont compris"
        - "GV.OC-05 : Les résultats, capacités et services dont dépend l'organisation sont compris"
        - "GV.OV-01 : Les résultats de la stratégie de gestion des risques sont examinés pour ajuster la direction"
        - "GV.OV-02 : La stratégie de gestion des risques cyber est revue et ajustée pour assurer la couverture"
        - "GV.OV-03 : La performance de la gestion des risques cyber est évaluée et revue pour ajustement"
        - "GV.PO-01 : La politique de cybersécurité est établie selon le contexte organisationnel et appliquée"
        - "GV.PO-02 : La politique de cybersécurité est revue, mise à jour et appliquée pour refléter les changements"
        - "GV.RM-01 : Les objectifs de gestion des risques sont établis et approuvés par les parties prenantes"
        - "GV.RM-02 : Les déclarations d'appétence et de tolérance au risque sont établies et maintenues"
        - "GV.RM-03 : La gestion des risques cyber est intégrée à la gestion des risques de l'entreprise"
        - "GV.RM-04 : Une orientation stratégique décrivant les options de réponse au risque est établie et communi..."
        - "GV.RM-05 : Les lignes de communication sur les risques cyber sont établies dans toute l'organisation"
        - "GV.RM-06 : Une méthode standardisée de calcul et de priorisation des risques cyber est établie"
        - "GV.RM-07 : Les opportunités stratégiques (risques positifs) sont caractérisées et intégrées aux décisions"
        - "GV.RR-01 : La direction est responsable du risque cyber et favorise une culture de sensibilisation au ri..."
        - "GV.RR-02 : Les rôles, responsabilités et autorités en cybersécurité sont établis et appliqués"
        - "GV.RR-03 : Des ressources adéquates sont allouées en cohérence avec la stratégie de risque cyber"
        - "GV.RR-04 : La cybersécurité est intégrée aux pratiques de ressources humaines"
        - "GV.SC-01 : Un programme et une stratégie de gestion des risques de la chaîne d'approvisionnement cyber s..."
        - "GV.SC-02 : Les rôles cyber des fournisseurs, clients et partenaires sont établis et coordonnés"
        - "GV.SC-03 : La gestion des risques de la chaîne d'approvisionnement est intégrée à la gestion des risques..."
        - "GV.SC-04 : Les fournisseurs sont connus et priorisés selon leur criticité"
        - "GV.SC-05 : Les exigences cyber pour les chaînes d'approvisionnement sont intégrées aux contrats"
        - "GV.SC-06 : La planification et la diligence raisonnable sont menées avant d'entrer en relation avec un f..."
        - "GV.SC-07 : Les risques liés aux fournisseurs et tiers sont évalués et suivis tout au long de la relation"
        - "GV.SC-08 : Les fournisseurs pertinents sont inclus dans la planification, la réponse et la reprise des i..."
        - "GV.SC-09 : Les pratiques de sécurité de la chaîne d'approvisionnement sont intégrées et suivies tout au..."
        - "GV.SC-10 : Les plans de gestion des risques de la chaîne d'approvisionnement prévoient les activités apr..."
        - "ID.AM-01 : Les inventaires du matériel géré par l'organisation sont maintenus"
        - "ID.AM-02 : Les inventaires des logiciels, services et systèmes sont maintenus"
        - "ID.AM-03 : Les communications réseau et flux de données autorisés sont représentés et maintenus"
        - "ID.AM-04 : Les inventaires des services fournis par les fournisseurs sont maintenus"
        - "ID.AM-05 : Les actifs sont priorisés selon leur classification, criticité, ressources et impact sur la m..."
        - "ID.AM-07 : Les inventaires des données et métadonnées des types de données désignés sont maintenus"
        - "ID.AM-08 : Les systèmes, matériels, logiciels, services et données sont gérés tout au long de leur cycle..."
        - "ID.IM-01 : Les améliorations sont identifiées à partir des évaluations"
        - "ID.IM-02 : Les améliorations sont identifiées à partir des tests et exercices de sécurité"
        - "ID.IM-03 : Les améliorations sont identifiées à partir de l'exécution des processus et activités opérati..."
        - "ID.IM-04 : Les plans de réponse aux incidents et autres plans cyber sont établis et améliorés"
        - "ID.RA-01 : Les vulnérabilités des actifs sont identifiées, validées et enregistrées"
        - "ID.RA-02 : Le renseignement sur les cybermenaces est reçu de forums et sources de partage d'information"
        - "ID.RA-03 : Les menaces internes et externes pesant sur l'organisation sont identifiées et enregistrées"
        - "ID.RA-04 : Les impacts et probabilités potentiels des menaces exploitant les vulnérabilités sont enregis..."
        - "ID.RA-05 : Menaces, vulnérabilités, probabilités et impacts informent le risque inhérent et la priorisation"
        - "ID.RA-06 : Les réponses aux risques sont choisies, priorisées, planifiées, suivies et communiquées"
        - "ID.RA-07 : Les changements et exceptions sont gérés, évalués pour leur impact sur le risque et suivis"
        - "ID.RA-08 : Les processus de réception et de traitement des divulgations de vulnérabilités sont établis"
        - "ID.RA-09 : L'authenticité et l'intégrité du matériel et des logiciels sont évaluées avant acquisition"
        - "ID.RA-10 : Les fournisseurs critiques sont évalués avant acquisition"
        - "PR.AA-01 : Les identités et identifiants des utilisateurs, services et matériels autorisés sont gérés"
        - "PR.AA-02 : Les identités sont vérifiées et liées aux identifiants selon le contexte des interactions"
        - "PR.AA-03 : Les utilisateurs, services et matériels sont authentifiés"
        - "PR.AA-04 : Les assertions d'identité sont protégées, transmises et vérifiées"
        - "PR.AA-05 : Les permissions et autorisations d'accès sont gérées selon le moindre privilège et la séparat..."
        - "PR.AA-06 : L'accès physique aux actifs est géré, surveillé et appliqué en cohérence avec le risque"
        - "PR.AT-01 : Le personnel reçoit une sensibilisation et une formation pour les tâches générales de cybersé..."
        - "PR.AT-02 : Les personnes occupant des rôles spécialisés reçoivent une sensibilisation et une formation c..."
        - "PR.DS-01 : La confidentialité, l'intégrité et la disponibilité des données au repos sont protégées"
        - "PR.DS-02 : La confidentialité, l'intégrité et la disponibilité des données en transit sont protégées"
        - "PR.DS-10 : La confidentialité, l'intégrité et la disponibilité des données en cours d'utilisation sont p..."
        - "PR.DS-11 : Les sauvegardes de données sont créées, protégées, maintenues et testées"
        - "PR.IR-01 : Les réseaux et environnements sont protégés contre les accès et usages logiques non autorisés"
        - "PR.IR-02 : Les actifs technologiques de l'organisation sont protégés contre les menaces environnementales"
        - "PR.IR-03 : Des mécanismes sont mis en œuvre pour atteindre les exigences de résilience en situation norm..."
        - "PR.IR-04 : Une capacité de ressources adéquate pour assurer la disponibilité est maintenue"
        - "PR.PS-01 : Les pratiques de gestion de configuration sont établies et appliquées"
        - "PR.PS-02 : Les logiciels sont maintenus, remplacés et retirés en cohérence avec le risque"
        - "PR.PS-03 : Le matériel est maintenu, remplacé et retiré en cohérence avec le risque"
        - "PR.PS-04 : Les journaux sont générés et mis à disposition pour la surveillance continue"
        - "PR.PS-05 : L'installation et l'exécution de logiciels non autorisés sont empêchées"
        - "PR.PS-06 : Des pratiques de développement logiciel sécurisé sont intégrées et suivies tout au long du cy..."
        - "DE.AE-02 : Les événements potentiellement indésirables sont analysés pour mieux comprendre les activités..."
        - "DE.AE-03 : Les informations issues de sources multiples sont corrélées"
        - "DE.AE-04 : L'impact et la portée estimés des événements indésirables sont compris"
        - "DE.AE-06 : Les informations sur les événements indésirables sont fournies au personnel et aux outils aut..."
        - "DE.AE-07 : Le renseignement sur les cybermenaces et les informations contextuelles sont intégrés à l'ana..."
        - "DE.AE-08 : Les incidents sont déclarés lorsque les événements indésirables répondent aux critères définis"
        - "DE.CM-01 : Les réseaux et services réseau sont surveillés pour détecter les événements potentiellement i..."
        - "DE.CM-02 : L'environnement physique est surveillé pour détecter les événements potentiellement indésirables"
        - "DE.CM-03 : L'activité du personnel et l'usage des technologies sont surveillés pour détecter les événeme..."
        - "DE.CM-06 : Les activités et services des prestataires externes sont surveillés pour détecter les événeme..."
        - "DE.CM-09 : Le matériel, les logiciels et les environnements d'exécution sont surveillés pour détecter le..."
        - "RS.AN-03 : Une analyse est menée pour établir ce qui s'est passé et la cause racine de l'incident"
        - "RS.AN-06 : Les actions menées durant une investigation sont enregistrées avec intégrité et provenance"
        - "RS.AN-07 : Les données et métadonnées d'incident sont collectées en préservant intégrité et provenance"
        - "RS.AN-08 : L'ampleur d'un incident est estimée et validée"
        - "RS.CO-02 : Les parties prenantes internes et externes sont notifiées des incidents"
        - "RS.CO-03 : Les informations sont partagées avec les parties prenantes internes et externes désignées"
        - "RS.MA-01 : Le plan de réponse aux incidents est exécuté en coordination avec les tiers concernés"
        - "RS.MA-02 : Les rapports d'incident sont triés et validés"
        - "RS.MA-03 : Les incidents sont catégorisés et priorisés"
        - "RS.MA-04 : Les incidents sont escaladés ou élevés selon les besoins"
        - "RS.MA-05 : Les critères de déclenchement de la reprise d'incident sont appliqués"
        - "RS.MI-01 : Les incidents sont confinés"
        - "RS.MI-02 : Les incidents sont éradiqués"
        - "RC.CO-03 : Les activités et l'avancement de la reprise sont communiqués aux parties prenantes désignées"
        - "RC.CO-04 : Les communications publiques sur la reprise d'incident utilisent des méthodes et messages app..."
        - "RC.RP-01 : La partie reprise du plan de réponse aux incidents est exécutée une fois déclenchée"
        - "RC.RP-02 : Les actions de reprise sont sélectionnées, cadrées, priorisées et exécutées"
        - "RC.RP-03 : L'intégrité des sauvegardes et autres actifs de restauration est vérifiée avant utilisation"
        - "RC.RP-04 : Les fonctions critiques et la gestion des risques informent les normes opérationnelles post-i..."
        - "RC.RP-05 : L'intégrité des actifs restaurés est vérifiée et le retour à un état de fonctionnement normal..."
        - "RC.RP-06 : La fin de la reprise d'incident est déclarée selon des critères, avec documentation complétée"
    validations:
      required: true

  - type: dropdown
    id: taille
    attributes:
      label: Taille de l'entreprise
      description: >
        Grille INSEE et Scale Up du panorama. Startup ou TPME : moins de 15 salariés et CA inférieur à 2 M EUR.
        PME : 15 à 250 salariés ou CA de 2 à 50 M EUR. ETI ou Scale Up : catégorie INSEE ETI ou levée supérieure
        à 12 M EUR. Grand groupe : 5000 salariés ou plus, CA supérieur à 1,5 Md EUR, ou filiale d'un grand groupe.
      options:
        - "Grand groupe"
        - "ETI / Scale Up"
        - "PME"
        - "Startup / TPME"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description courte
      description: Une à deux phrases (objectif et fonctionnalités principales)
    validations:
      required: true

  - type: textarea
    id: description_detaillee
    attributes:
      label: Description détaillée
      description: Description plus complète (produits, cibles, différenciateurs)
    validations:
      required: true

  - type: input
    id: mots_cles
    attributes:
      label: Mots-clés
      description: Mots-clés séparés par des virgules, utilisés pour la recherche
      placeholder: "EDR, XDR, détection, SOC"
    validations:
      required: true

  - type: dropdown
    id: objectif_nis2
    attributes:
      label: Objectif NIS2 principal
      options:
        - Recensement des SI
        - Mise en œuvre d'un cadre de gouvernance
        - Maîtrise de l'écosystème
        - Maîtrise des SI
        - Sécurisation de l'architecture des SI
        - Sécurisation des accès distants aux SI
        - Protection des SI contre les codes malveillants
        - Gestion des identités et des accès aux SI
        - Identification et réaction aux incidents de sécurité
        - Continuité et reprise d'activité
        - Mise en œuvre d'une approche par les risques
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Site web
      placeholder: "https://exemple.fr"
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact (email ou page contact)
      placeholder: "contact@exemple.fr"
    validations:
      required: true

  - type: textarea
    id: logo_upload
    attributes:
      label: Logo (fichier ou URL)
      description: Glissez/collez une image (PNG, GIF, JPG, SVG, WebP) que GitHub héberge tout seul, OU collez l'URL publique directe du logo. L'un ou l'autre suffit.
      placeholder: "Glissez l'image ici, collez-la (Ctrl/Cmd + V), ou collez une URL https://exemple.fr/logo.svg"
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Engagement
      options:
        - label: Les informations fournies sont exactes
          required: true
        - label: J'ai les droits sur le logo fourni
          required: true
        - label: J'accepte la publication sur le panorama
          required: true
