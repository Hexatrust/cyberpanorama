name: Modifier une entreprise du panorama
description: Proposer une correction sur une solution deja presente dans le CyberPanorama
title: "[MODIFICATION] : "
labels: ["panorama:edit"]
body:
  - type: markdown
    attributes:
      value: |
        ## Modifier une solution existante
        Indiquez le nom exact de l'entreprise telle qu'affichee dans le panorama, puis seulement les champs
        a changer (laissez vide ce qui ne change pas). Une Pull Request sera preparee pour validation.

  - type: input
    id: company_name
    attributes:
      label: Nom exact de l'entreprise ou de la solution a modifier
      placeholder: "Ex : CyberCompany"
    validations:
      required: true

  - type: dropdown
    id: fonction_nist
    attributes:
      label: Nouvelle fonction NIST (si changement)
      options: ["(inchange)", Gouverner, Identifier, Proteger, Detecter, Repondre, Recuperer]

  - type: dropdown
    id: taille
    attributes:
      label: Nouvelle taille (si changement)
      options: ["(inchange)", "Grand groupe", "ETI / Scale Up", "PME", "Startup / TPME"]

  - type: textarea
    id: description
    attributes:
      label: Nouvelle description (si changement)

  - type: input
    id: website
    attributes:
      label: Nouveau site web (si changement)

  - type: input
    id: contact
    attributes:
      label: Nouveau contact (si changement)

  - type: textarea
    id: logo_upload
    attributes:
      label: Logo (glissez ou collez une image PNG, GIF, JPG, SVG)
      description: Deposez le fichier ici si vous changez le logo. Sinon laissez vide (ou mettez l'URL ci-dessous).
      placeholder: "Glissez l'image ici, ou collez-la (Ctrl/Cmd + V)."

  - type: input
    id: logo_url
    attributes:
      label: Nouvelle URL de logo (si changement)
      description: Lien direct public (PNG, GIF, JPG, SVG ou WebP)

  - type: textarea
    id: raison
    attributes:
      label: Raison de la modification
      description: Expliquez brievement (rebrand, rachat, erreur, mise a jour)
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Engagement
      options:
        - label: Les informations fournies sont exactes
          required: true
