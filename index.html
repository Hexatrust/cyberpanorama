<!doctype html>
<html lang="fr">
  <head>

    />

    <!-- Favicon (marque hexagone) -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      rel="icon"

      sizes="32x32"
      href="assets/favicon-32.png"

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <!-- Vignette de partage (Open Graph : Slack, Discord, LinkedIn, WhatsApp...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CyberPanorama" />
    <meta property="og:title" content="CyberPanorama Hexatrust & CESIN" />
    <meta
      property="og:description"
      content="276 acteurs de la cybersécurité française, classés par fonction NIST CSF 2.0."
    />
    <meta property="og:url" content="https://rustaddict.github.io/test-3/" />
    <meta
      property="og:image"
      content="https://rustaddict.github.io/test-3/assets/og-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hexagone du panorama CyberPanorama : six secteurs de couleur NIST."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CyberPanorama Hexatrust & CESIN" />
    <meta
      name="twitter:description"
      content="276 acteurs de la cybersécurité française, classés par fonction NIST CSF 2.0."
    />
    <meta
      name="twitter:image"
      content="https://rustaddict.github.io/test-3/assets/og-preview.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/topbar.css" />
    <link rel="stylesheet" href="css/panorama.css" />
    <link rel="stylesheet" href="css/panels.css" />
    <link rel="stylesheet" href="css/filters.css" />
    <link rel="stylesheet" href="css/list.css" />
    <link rel="stylesheet" href="css/modals.css" />
    <style id="skeletonStyles">
      /* Skeleton de chargement — rendu instantané (inline), masqué dès que le panorama est prêt */
      .app-skeleton {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        gap: 0;
        background: var(--bg, #fbf7f1);
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      .app-skeleton.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .skel-stack {
        display: grid;
        place-items: center;
        gap: 22px;
      }
      .skel-panorama {
        width: min(60vmin, 560px);
        aspect-ratio: 1 / 1;
        position: relative;
        will-change: transform, opacity;
        background: conic-gradient(
          from -90deg,
          #fab746 0 16.66%,
          #ed7368 0 33.33%,
          #92c78f 0 50%,
          #f7f19e 0 66.66%,
          #4ab2df 0 83.33%,
          #9190c6 0 100%
        );
        /* Hexagone (flat-top) au lieu du cercle : coherent avec le panorama */
        clip-path: polygon(
          25% 0%,
          75% 0%,
          100% 50%,
          75% 100%,
          25% 100%,
          0% 50%
        );
        opacity: 0.35;
        animation: skelPulse 1.7s ease-in-out infinite;
      }
      .skel-panorama::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          rgba(255, 106, 61, 0) 0 78%,
          rgba(255, 106, 61, 0.55) 92%,
          rgba(255, 106, 61, 0) 100%
        );
        animation: skelSweep 1.5s linear infinite;
      }
      .skel-core {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 34%;
        height: 34%;
        clip-path: polygon(
          25% 0%,
          75% 0%,
          100% 50%,
          75% 100%,
          25% 100%,
          0% 50%
        );
        background: var(--surface, #fff);
        display: grid;
        place-items: center;
      }
      .skel-core span {
        width: 56%;
        height: 12px;
        border-radius: 6px;
        background: linear-gradient(
          90deg,
          #ece4d6 25%,
          #f6efe4 37%,
          #ece4d6 63%
        );
        background-size: 400% 100%;
        animation: skelShimmer 1.3s ease infinite;
      }
      .skel-label {
        display: grid;
        gap: 8px;
        justify-items: center;
      }
      .skel-label b {
        font:
          600 13px/1 "Plus Jakarta Sans",
          system-ui,
          sans-serif;
        letter-spacing: 0.04em;
        color: var(--ink-soft, #4a4870);
      }
      .skel-dots {
        display: flex;
        gap: 6px;
      }
      .skel-dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent, #ff6a3d);
        opacity: 0.35;
        animation: skelDot 1.1s ease-in-out infinite;
      }
      .skel-dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .skel-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes skelPulse {
        0%,
        100% {
          opacity: 0.28;
          transform: scale(0.985);
        }
        50% {
          opacity: 0.42;
          transform: scale(1);
        }
      }
      @keyframes skelSweep {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes skelShimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0 0;
        }
      }
      @keyframes skelDot {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skel-panorama,
        .skel-panorama::after,
        .skel-core span,
        .skel-dots i {
          animation: none;
        }
      }
    </style>
    <script src="data/solutions.generated.js" defer></script>
    <script src="js/runtime-config.js" defer></script>
    <script src="js/core/config.js" defer></script>
    <script src="js/core/utils.js" defer></script>
    <script src="js/search/search-index.js" defer></script>
    <script src="js/search/typesense.js" defer></script>
    <script src="js/core/layout.js" defer></script>
    <script src="js/components/filters.js" defer></script>
    <script src="js/search/search.js" defer></script>
    <script src="js/components/panorama.js" defer></script>
    <script src="js/components/zoom.js" defer></script>
    <script src="js/components/list.js" defer></script>
    <script src="js/components/drawer.js" defer></script>
    <script src="js/components/modal.js" defer></script>
    <script src="js/components/sector-modal.js" defer></script>
    <script src="js/components/mobile-menu.js" defer></script>
    <script src="js/app.js" defer></script>
    <script>
      // Service worker : cache des logos (rendu instantane au rechargement et entre les filtres).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-title">CyberPanorama</h1>
          <span class="topbar-sep" aria-hidden="true"></span>
          <button class="topbar-btn" id="filtersToggle" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                d="M3 6h18M6 12h12M10 18h4"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
            Filtres
            <span class="topbar-btn-count" id="filtersCountBadge" hidden
              >0</span
            >
          </button>
        </div>

        <div class="topbar-center">
          <div class="search-box" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
              <circle
                cx="11"
                cy="11"
                r="7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="m20 20-3.5-3.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <input
              type="search"
              id="searchInput"
              placeholder="Rechercher une solution, une entreprise…"
              autocomplete="off"
              aria-label="Rechercher une solution"
            />
            <button
              class="search-clear"
              id="searchClear"
              type="button"
              aria-label="Effacer la recherche"
              hidden
            >
              <svg
                viewBox="0 0 24 24"
                width="13"
                height="13"
                aria-hidden="true"
              >
                <path
                  d="M6 6l12 12M18 6 6 18"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="topbar-right">
          <button
            class="topbar-btn topbar-btn-list"
            id="drawerToggle"
            type="button"
            aria-controls="drawer"
            aria-expanded="false"
          >
            <strong id="resultCount">0</strong>
            <span>solutions</span>
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                d="M9 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="2.2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            class="topbar-burger"
            id="menuToggle"
            type="button"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M4 7h16M4 12h16M4 17h16"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- Menu hamburger (mobile) : recherche + Filtres + Solutions y sont deplaces sous 760px. -->
      <div class="mobile-menu" id="mobileMenu" hidden></div>

      <main class="stage" aria-label="Panorama">
        <div class="app-skeleton" id="appSkeleton" aria-hidden="true">
          <div class="skel-stack">
            <div class="skel-panorama">
              <div class="skel-core"><span></span></div>
            </div>
            <div class="skel-label">
              <b>Chargement du panorama…</b>
              <div class="skel-dots"><i></i><i></i><i></i></div>
            </div>
          </div>
        </div>
        <div class="hex-wrapper" id="hexWrapper">
          <div class="hex-frame" id="hexFrame">
            <svg
              class="hex-panorama"
              id="hexPanorama"
              viewBox="0 0 1400 1400"
              role="img"
              aria-label="Panorama circulaire des solutions CyberPanorama par fonction NIST CSF"
            >
              <defs>
                <filter
                  id="softShadow"
                  x="-30%"
                  y="-30%"
                  width="160%"
                  height="160%"
                >
                  <feDropShadow
                    dx="0"
                    dy="8"
                    stdDeviation="16"
                    flood-color="#1f2240"
                    flood-opacity="0.10"
                  />
                </filter>
              </defs>
              <g id="sectorLayer"></g>
              <g id="bannerLayer"></g>
              <g id="coreLayer">
                <circle class="core-outer" cx="700" cy="700" r="178"></circle>
                <circle class="core-inner" cx="700" cy="700" r="162"></circle>
                <image
                  class="core-hexatrust"
                  href="assets/hexatrust-logo.png"
                  x="585"
                  y="600"
                  width="230"
                  height="106"
                  preserveAspectRatio="xMidYMid meet"
                ></image>
                <image
                  class="core-cesin"
                  href="assets/cesin-logo.svg"
                  x="610"
                  y="718"
                  width="180"
                  height="68"
                  preserveAspectRatio="xMidYMid meet"
                ></image>
              </g>
            </svg>
            <div
              class="logo-overlay"
              id="logoLayer"
              aria-label="Logos des solutions"
            ></div>
          </div>
        </div>

        <div class="floating-controls" aria-label="Contrôles du panorama">
          <button
            class="zoom-btn zoom-hand"
            id="panToggle"
            type="button"
            aria-pressed="false"
            aria-label="Mode main : déplacer le panorama"
            title="Mode main : glisser pour déplacer"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                d="M8 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v1m0-.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1.5a5 5 0 0 1-3.6-1.5l-3.2-3.3a1.5 1.5 0 0 1 2.1-2.1L8 14V11"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <span class="zoom-sep" aria-hidden="true"></span>
          <button
            class="zoom-btn zoom-icon"
            id="zoomOut"
            type="button"
            aria-label="Réduire le zoom"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path
                d="M5 12h14"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <input
            class="zoom-value"
            id="zoomValue"
            value="100%"
            inputmode="numeric"
            autocomplete="off"
            aria-label="Zoom en pourcentage (modifiable)"
            title="Saisir un zoom exact (%)"
          />
          <button
            class="zoom-btn zoom-icon"
            id="zoomIn"
            type="button"
            aria-label="Augmenter le zoom"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button class="zoom-btn zoom-reset" id="zoomReset" type="button">
            Ajuster
          </button>
        </div>
      </main>
    </div>

    <aside
      class="drawer drawer-left"
      id="filtersDrawer"
      hidden
      aria-label="Filtres NIST"
    >
      <header class="drawer-head">
        <div>
          <h2>Filtres NIST</h2>
          <button class="reset-button" id="resetFilters" type="button">
            Réinitialiser
          </button>
        </div>
        <button
          class="drawer-close"
          id="filtersClose"
          type="button"
          aria-label="Fermer"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path
              d="M6 6l12 12M18 6 6 18"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <div class="search-box filters-search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
          <circle
            cx="11"
            cy="11"
            r="7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="m20 20-3.5-3.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          type="search"
          id="filtersSearchInput"
          placeholder="Rechercher une solution…"
          autocomplete="off"
          aria-label="Rechercher une solution"
        />
      </div>

      <div class="drawer-scroll">
        <section class="filter-group" aria-labelledby="level1Title">
          <h3 id="level1Title">
            Fonctions <span class="muted">niveau 1</span>
          </h3>
          <div class="chip-grid" id="functionFilters"></div>
        </section>

        <section class="filter-group" aria-labelledby="level2Title">
          <h3 id="level2Title">
            Catégories <span class="muted">niveau 2</span>
          </h3>
          <div class="check-list" id="level2Filters"></div>
        </section>

        <section class="filter-group" aria-labelledby="level3Title">
          <h3 id="level3Title">
            Sous-catégories <span class="muted">niveau 3</span>
          </h3>
          <div class="check-list" id="level3Filters"></div>
        </section>

        <section class="filter-group" aria-labelledby="sizeTitle">
          <h3 id="sizeTitle">
            Type d'entreprise <span class="muted">taille</span>
          </h3>
          <div class="check-list" id="sizeFilters"></div>
        </section>
      </div>
    </aside>

    <aside
      class="drawer drawer-right"
      id="drawer"
      hidden
      aria-label="Liste des solutions filtrées"
    >
      <header class="drawer-head">
        <div>
          <h2>Solutions</h2>
          <p><strong id="resultsCount">0</strong> visibles</p>
        </div>
        <button
          class="drawer-close"
          id="drawerClose"
          type="button"
          aria-label="Fermer"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path
              d="M6 6l12 12M18 6 6 18"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>
      <div class="results-active" id="activeChips"></div>
      <div class="results-list" id="solutionList" role="list"></div>
      <div class="results-empty" id="emptyState" hidden>
        <strong>Aucune solution</strong>
        <p>Ajustez vos filtres ou effacez la recherche.</p>
      </div>
    </aside>

    <div class="modal-backdrop" id="sectorModal" hidden>
      <div
        class="sector-popup-slice"
        role="dialog"
        aria-modal="true"
        aria-label="Vue détaillée du secteur"
      >
        <div class="sector-popup-frame" id="sectorPopupFrame">
          <svg id="sectorPopupSvg" role="img">
            <g id="popupSectorLayer"></g>
            <g id="popupBannerLayer"></g>
          </svg>
          <div class="logo-overlay" id="popupLogoLayer"></div>
        </div>
        <button
          class="sector-popup-close-btn"
          id="sectorPopupClose"
          type="button"
        >
          Fermer
        </button>
        <p class="sector-popup-info" aria-hidden="true">
          <strong id="sectorPopupTitle">Secteur</strong>
          <span><strong id="sectorPopupCount">0</strong> solutions</span>
        </p>
      </div>
    </div>

    <div class="modal-backdrop" id="solutionModal" hidden>
      <article
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <header class="modal-head">
          <div class="modal-logo" id="modalLogo" aria-hidden="true"></div>
          <div class="modal-titles">
            <p class="modal-eyebrow" id="modalCompany"></p>
            <h2 id="modalTitle"></h2>
            <div class="modal-pillrow-wrap">
              <span class="modal-pillrow" id="modalFunction"></span>
              <span class="modal-sizepill" id="modalSize"></span>
            </div>
          </div>
          <button
            class="modal-close"
            id="modalClose"
            type="button"
            aria-label="Fermer"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6 6 18"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="modal-body" id="modalBody"></div>
      </article>
    </div>
    <script>
      /* Filet de sécurité : retire le skeleton même si l'app échoue à le masquer */
      (function () {
        function hide() {
          var s = document.getElementById("appSkeleton");
          if (s) s.classList.add("is-hidden");
        }
        window.addEventListener("load", function () {
          setTimeout(hide, 4000);
        });
        setTimeout(hide, 9000);
      })();
    </script>
  </body>
</html>
